<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>WebDeveloperStanislavVidloha_CV</title>

		<link
			rel="stylesheet"
			href="styles/index.css"
		/>
		<link
			rel="stylesheet"
			href="styles/index_adaptive.css"
		/>
	</head>

	<body>
		<div class="container">
			<div class="aboutMe-wrapper">
				<img
					class="aboutMe-img"
					src="images/Avatar.jpeg"
					alt="Avatar-Stanislav"
				/>

				<div class="aboutMe-info">
					<h1 class="aboutMe-title">Stanislav Vidloha</h1>
					<p class="aboutMe-text">Beginner developer</p>
				</div>
			</div>

			<div class="wrapper">
				<h2 class="title">Social</h2>
				<div class="social-links">
					<a
						href="https://www.instagram.com/stanislavvidloha/"
						class="social-link"
					>
						<span class="social-type">Instagram</span>
					</a>
					<span class="social-line">|</span>
					<a
						href="https://www.facebook.com/StanislavVidloha/"
						class="social-link"
					>
						<span class="social-type">Facebook</span>
					</a>
					<span class="social-line">|</span>
					<a
						href="https://vk.ru/id_stafik95"
						class="social-link"
					>
						<span class="social-type">VK</span>
					</a>
				</div>
			</div>

			<div class="wrapper">
				<h2 class="title">Hobby</h2>
				<ol class="hobby-list">
					<li class="hobby-type">Trips</li>
					<li class="hobby-type">Learning something new</li>
					<li class="hobby-type">Sport</li>
					<li class="hobby-type">Games</li>
				</ol>
			</div>

			<div class="wrapper">
				<h2 class="title">Experience</h2>
				<p class="text">freelance</p>
			</div>

			<div class="wrapper">
				<h2 class="title">Contact me</h2>
				<form action="/">
					<div class="line-form">
						<div class="forms">
							<label for="name">Your name</label>
							<input
								type="text"
								id="name"
								placeholder="enter name"
							/>
						</div>

						<div class="forms">
							<label for="email">Your email</label>
							<input
								type="email"
								id="email"
								placeholder="enter email"
							/>
						</div>
					</div>

					<div class="forms">
						<label for="text">Your text</label>
						<textarea
							id="text"
							placeholder="enter text"
						></textarea>
						<input
							type="submit"
							value="Send"
						/>
					</div>
				</form>
			</div>
		</div>

		<script src="./scripts/index.js"></script>
	</body>
</html>
